services:
  web:
    build:
      context: .
    command: bash -lc "bundle install && bundle exec rails server -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: development
      BUNDLE_WITHOUT: ""
      MONGODB_HOST: mongo
      MONGODB_PORT: 27017
      MONGODB_DATABASE: simple_ledger_development
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  bundle_cache:
  mongo_data:
